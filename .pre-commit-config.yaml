default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: "v0.23.1"
    hooks:
      - id: markdownlint-cli2
